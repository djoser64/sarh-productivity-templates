name: Weekly Free SEO Agent
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-seo-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run SEO Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/seo_agent.py
      - name: Commit and push
        run: |
          git config --local user.email "seo-agent@sarhtech.local"
          git config --local user.name "SARH SEO Agent"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(seo): weekly optimization" && git push)
